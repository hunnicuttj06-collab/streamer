services:
  app:
    platform: linux/amd64
    build: .
    env_file: .env
    environment:
      APP_DATA_DIR: /data
      PLAYER_BIND_ADDRESS: 0.0.0.0
      PLAYER_PORT: 8080
    volumes:
      - broadcaster-data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped

  https:
    image: caddy:2-alpine
    environment:
      PLAYER_DOMAIN: ${PLAYER_DOMAIN:?Set PLAYER_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  broadcaster-data:
  caddy-data:
  caddy-config:
